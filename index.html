<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오락실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  :root{
    --floor:#E7EAE6;
    --floor-line:#D3D8D2;
    --ink:#1B2430;
    --paper:#FFFFFF;
    --blue:#1A3E8C;
    --blue-dark:#122C64;
    --hole:#B9C0BA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--floor);
    background-image:
      linear-gradient(var(--floor-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--floor-line) 1px, transparent 1px);
    background-size:72px 72px;
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;
    justify-content:center;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .shell{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}

  .top{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .brand{
    font-weight:800;
    font-size:20px;
    letter-spacing:-0.04em;
    line-height:1;
    padding:8px 12px;
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:4px 4px 0 var(--ink);
    color:var(--ink);
    text-decoration:none;
    display:inline-block;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  a.brand[href]:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  a.brand[href]:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 순위 버튼 */
  .rankbtn{
    flex:none;
    display:grid;
    place-items:center;
    width:54px;
    height:42px;
    padding:0;
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:4px 4px 0 var(--ink);
    cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .rankbtn svg{display:block;width:24px;height:18px;}
  .rankbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .rankbtn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 순위판 */
  .ovl{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(27,36,48,.42);
  }
  .ovl.on{display:flex;}
  @media (min-width:600px){ .ovl{align-items:center;} }

  .sheet{
    width:100%;
    max-width:560px;
    max-height:86dvh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    animation:rise .16s ease-out;
  }
  @keyframes rise{from{transform:translateY(16px);opacity:.3;} to{transform:none;opacity:1;}}

  .sheet-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:3px solid var(--ink);
  }
  .sheet-top h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.04em;}
  .sheet-act{display:flex;gap:8px;align-items:center;}

  .mini{
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font:inherit;
    font-size:13px;
    font-weight:800;
    line-height:1;
    padding:7px 9px;
    cursor:pointer;
  }
  .mini:active{transform:translate(2px,2px);}
  .mini:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .mini.x{width:34px;}

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:12px 14px;
    border-bottom:2px solid #DCE0DB;
  }
  @media (min-width:600px){ .tabs{grid-template-columns:1fr 1fr 1fr;} }
  .tab{
    display:flex;
    align-items:center;
    min-width:0;
    border:2px solid var(--ink);
    border-left:6px solid var(--chip, var(--ink));
    background:var(--paper);
    color:var(--ink);
    font:inherit;
    font-size:13.5px;
    font-weight:800;
    letter-spacing:-0.04em;
    line-height:1;
    padding:9px 8px;
    cursor:pointer;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tab.on{background:var(--ink);color:#FFFFFF;}
  .tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  @media (max-width:340px){ .tab{font-size:12.5px;padding:9px 6px;} }

  .rows{overflow-y:auto;padding:2px 14px 18px;-webkit-overflow-scrolling:touch;}
  .seg{display:flex;gap:8px;padding:12px 0 2px;}
  .seg .tab{flex:1 1 0;border-left:2px solid var(--ink);justify-content:center;}
  .note{padding:26px 2px;color:#6B7480;font-size:15px;}
  .note b{display:block;color:var(--ink);font-size:15px;margin-bottom:10px;}

  .bd{width:100%;border-collapse:collapse;}
  .bd th{
    position:sticky;
    top:0;
    background:var(--paper);
    font-size:12px;
    font-weight:700;
    color:#6B7480;
    text-align:left;
    padding:10px 6px;
    border-bottom:2px solid var(--ink);
  }
  .bd td{padding:9px 6px;border-bottom:1px solid #E1E5E0;font-size:15px;}
  .bd .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bd .r{width:36px;padding-right:0;}
  .bd .nm span{
    display:block;
    max-width:10.5em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:700;
  }
  .bd tr.mine td{background:#FFF3CE;}
  .rk{
    display:grid;
    place-items:center;
    width:26px;
    height:24px;
    border:2px solid var(--ink);
    font-size:12px;
    font-weight:800;
    font-style:normal;
    font-variant-numeric:tabular-nums;
  }
  .rk.g1{background:#FFC400;}
  .rk.g2{background:#D7DDE2;}
  .rk.g3{background:#E2A46A;}

  .stage{
    margin:clamp(22px,6vh,48px) 0 clamp(24px,5vh,40px);
    width:min(74vw,44vh,360px);
    aspect-ratio:1/1;
    position:relative;
    touch-action:pan-y;   /* 세로 스크롤은 브라우저에, 가로 제스처만 받는다 */
    cursor:grab;
  }
  .stage.dragging{cursor:grabbing;}

  /* 바닥에 뚫린 구멍 */
  .hole{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #F7F8F5 0%, #E2E6E1 58%, #B3BAB3 100%);
    overflow:hidden;
    box-shadow:inset 0 14px 26px rgba(27,36,48,.34), inset 0 -6px 14px rgba(27,36,48,.12);
    animation:breathe 5.9s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{box-shadow:inset 0 14px 26px rgba(27,36,48,.34), inset 0 -6px 14px rgba(27,36,48,.12);}
    50%    {box-shadow:inset 0 17px 30px rgba(27,36,48,.40), inset 0 -5px 12px rgba(27,36,48,.10);}
  }
  .hole canvas{display:block;width:100%;height:100%;}

  /* 개구부 둘레 */
  .rim{
    position:absolute;
    inset:-13px;
    border-radius:50%;
    padding:13px;
    background:var(--blue);
    -webkit-mask:radial-gradient(circle, transparent calc(50% - 13px), #000 calc(50% - 13px));
    mask:radial-gradient(circle, transparent calc(50% - 13px), #000 calc(50% - 13px));
    pointer-events:none;
  }
  .rim::after{
    content:"";
    position:absolute;
    inset:13px;
    border-radius:50%;
    box-shadow:0 0 0 3px var(--blue-dark);
  }

  .games{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .game{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    min-height:116px;
    padding:20px 14px 15px;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    text-decoration:none;
    color:var(--ink);
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.04em;
    line-height:1.25;
    word-break:keep-all;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .game::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:9px;
    background:var(--chip);
  }
  .game .ico{width:40px;height:30px;display:block;flex:none;}
  .game small{
    display:block;
    margin-top:5px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:-0.02em;
    color:#6B7480;
  }
  .game:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
  .game:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}
  .game[aria-disabled="true"]{opacity:.42;pointer-events:none;}

  .game.blank{
    background:transparent;
    border-style:dashed;
    border-color:#B4BCB4;
    box-shadow:none;
    pointer-events:none;
  }
  .game.blank::before{display:none;}

  @media (prefers-reduced-motion:reduce){
    .game,.brand,.rankbtn{transition:none;}
    .hole{animation:none;}
    .sheet{animation:none;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a class="brand" id="brand">오락실</a>
    <button class="rankbtn" id="rankBtn" type="button"
            aria-label="순위" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 18" aria-hidden="true">
        <g stroke="#1B2430" stroke-width="1.5">
          <rect x="0.8" y="0.9"  width="22.4" height="4" fill="#FFC400"/>
          <rect x="0.8" y="7"    width="22.4" height="4" fill="#D7DDE2"/>
          <rect x="0.8" y="13.1" width="22.4" height="4" fill="#E2A46A"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="hole" id="hole"></div>
    <div class="rim"></div>
  </div>

  <nav class="games" id="games"></nav>
</div>

<div class="ovl" id="ovl">
  <section class="sheet" role="dialog" aria-modal="true" aria-label="순위">
    <header class="sheet-top">
      <h2>순위</h2>
      <div class="sheet-act">
        <button class="mini" id="rankReload" type="button">새로고침</button>
        <button class="mini x" id="rankClose" type="button" aria-label="닫기">✕</button>
      </div>
    </header>
    <div class="tabs" id="rankTabs"></div>
    <div class="rows" id="rankRows"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─────────────────────────────────────────────
   사이트 첫 화면 주소를 넣으면 「오락실」 상자가 홈 링크가 됩니다.
   비워두면 지금처럼 그냥 상자로 남습니다.
   ───────────────────────────────────────────── */
var HOME_URL = '';

(function buildBrand(){
  if (!HOME_URL) return;
  var b = document.getElementById('brand');
  b.href = HOME_URL;
  b.target = '_top';
})();

/* ─────────────────────────────────────────────
   게임 목록 — url 만 채우면 버튼이 살아납니다.
   name 을 비우면 빈 칸으로 남습니다.
   ───────────────────────────────────────────── */

  jine:
    '<svg class="ico" viewBox="0 0 26 20" aria-hidden="true">' +

        '<path d="M3 12.5l-1.5 4M7 12.5l-1.5 4M11 12.5l-1.5 4M15 12.5l-1.5 4M19 12.5l-1.5 4"/>' +
        '<path d="M23 7l2.4-2.6M23.4 10.6l2.2 2"/>' +

      '<g stroke="#5e2618" stroke-width="1.2">' +

        '<circle cx="21.6" cy="9.8" r="3" fill="#cf6a4a"/>' +

    '<svg class="ico" viewBox="0 0 32 24" aria-hidden="true">' +

      '</g>' +
      '<circle cx="13.4" cy="19.6" r="2.4" fill="#1B2430"/>' +

    '</svg>',
  forklift:
    '<svg class="ico" viewBox="0 0 32 24" aria-hidden="true">' +
      '<g stroke="#1B2430" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
        '<path d="M18.6 2.6v14M21.4 2.6v14"/>' +
        '<path d="M18.6 15.4h9"/>' +
        '<path d="M4 9h13v7H4z" fill="#F2A03C"/>' +
        '<path d="M6 9V3h9v6"/>' +
        '<path d="M5 3h11"/>' +
      '</g>' +
      '<circle cx="8" cy="18.4" r="3.1" fill="#1B2430"/>' +
      '<circle cx="15.4" cy="19.2" r="2.3" fill="#1B2430"/>' +
    '</svg>',
  whale:
    '<svg class="ico" viewBox="0 0 32 24" aria-hidden="true">' +
      '<g stroke="#1B2430" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
        '<path d="M24.6 8.4L30.4 5.4v14.2l-5.8-3z" fill="#7FC5D9"/>' +
        '<ellipse cx="14.6" cy="12.6" rx="10.4" ry="6.2" fill="#9FD6E3"/>' +

      '</g>' +
      '<circle cx="8.6" cy="11.4" r="1.3" fill="#1B2430"/>' +
    '</svg>',
  split:
    '<svg class="ico" viewBox="0 0 32 24" aria-hidden="true">' +
      '<g stroke="#1B2430" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="10.4" cy="6.2" r="2.9" fill="#9AA3B2"/>' +
        '<path d="M10.4 9.4c-2.3 0-3.8 1.5-3.8 3.6v3.4h7.6v-3.4c0-2.1-1.5-3.6-3.8-3.6z" fill="#9AA3B2"/>' +

        '<path d="M19.6 16.4l-1.2 4.8M23.6 16.4l1.2 4.8" fill="none"/>' +

  selflove:
    '<svg class="ico" viewBox="0 0 32 24" aria-hidden="true">' +
      '<g stroke="#1B2430" stroke-width="1.8" stroke-linejoin="round">' +

        '<rect x="22" y="9.4" width="4.8" height="6.6" rx="2.4" fill="#EDBC97"/>' +
      '</g>' +

var GAMES = [
  { name: '지네 못 걷기',       url: 'https://aaffffffffff123-lang.github.io/jine/',     chip: '#C0563F', icon: ICONS.jine,     desc: '' },
  { name: '고래 칭찬하기',      url: 'https://aaffffffffff123-lang.github.io/whale/',    chip: '#1E93B0', icon: ICONS.whale,    desc: '' },
  { name: '나에게서 도망치기',  url: 'https://aaffffffffff123-lang.github.io/split/',    chip: '#4A5766', icon: ICONS.split,    desc: '' },
  { name: '스스로를 사랑하기',  url: 'https://aaffffffffff123-lang.github.io/selflove/', chip: '#E8306B', icon: ICONS.selflove, desc: '' },
  { name: '심야물류센터3층',    url: 'https://aaffffffffff123-lang.github.io/floor3/',   chip: '#FFC400', icon: ICONS.cart,     desc: '' },
  { name: '지게차 연수원',      url: 'https://aaffffffffff123-lang.github.io/forklift/', chip: '#F2600C', icon: ICONS.forklift, desc: '' }
];

(function buildGames(){
  var wrap = document.getElementById('games');
  for (var i = 0; i < GAMES.length; i++) {
    var g = GAMES[i];

    if (!g.name) {
      var blank = document.createElement('div');
      blank.className = 'game blank';
      wrap.appendChild(blank);
      continue;
    }

    var a = document.createElement('a');
    a.className = 'game';
    a.style.setProperty('--chip', g.chip);
    a.innerHTML = g.icon;
    var label = document.createElement('span');
    label.textContent = g.name;
    if (g.desc) {
      var sub = document.createElement('small');
      sub.textContent = g.desc;
      label.appendChild(sub);
    }
    a.appendChild(label);

    if (g.url) {
      a.href = g.url;
      a.target = '_top';
    } else {
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('tabindex', '-1');
    }
    wrap.appendChild(a);
  }
})();

/* ─────────────────────────────────────────────
   순위판 — 게임들이 쓰는 오락실 공용 서버(GAS)에서 그대로 읽어옵니다.
   서버 주소를 바꾸면 이 한 줄만 고치면 됩니다.
   ───────────────────────────────────────────── */
var RANK_URL = 'https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec';
var RANK_TTL = 45000;   // 이 시간 안에 다시 열면 서버를 또 부르지 않습니다
var RANK_MAX = 100;     // 한 판에 보여줄 줄 수

(function rankPanel(){
  var ovl    = document.getElementById('ovl');
  var tabsEl = document.getElementById('rankTabs');
  var rowsEl = document.getElementById('rankRows');
  var btn    = document.getElementById('rankBtn');
  var closeB = document.getElementById('rankClose');
  var reloadB= document.getElementById('rankReload');

  /* me: 게임이 브라우저에 저장해 둔 내 이름. 같은 주소라서 그대로 읽힙니다.
     이름이 겹치면 남의 줄도 같이 표시될 수 있습니다. */
  var BOARDS = [
    { key:'jine',     name:'지네 못 걷기',      chip:'#C0563F', me:'jine_name' },
    { key:'whale',    name:'고래 칭찬하기',     chip:'#1E93B0', me:'whale_name' },
    { key:'najasin',  name:'나에게서 도망치기', chip:'#4A5766', me:'najasin_name' },
    { key:'selflove', name:'스스로를 사랑하기', chip:'#E8306B', me:'selflove_name' },
    { key:'floor3',   name:'심야물류센터3층',   chip:'#FFC400', me:'' },
    { key:'forklift', name:'지게차 연수원',     chip:'#F2600C', me:'' }
  ];

  var cache = {};              // 데이터키 → { at, data }
  var cur = BOARDS[0].key;
  var whaleMode = 'phone';
  var allState = 0;            // 0 안 해봄 · 1 됨 · 2 서버가 아직 모름
  var seq = 0;                 // 늦게 도착한 응답이 화면을 덮어쓰지 않게

  /* ── 통신 */
  function jsonp(qs, cb){
    var name = 'arc_' + Math.random().toString(36).slice(2);
    var sc = document.createElement('script');
    var done = false;
    var timer = setTimeout(function(){ finish(null); }, 12000);

    function finish(d){
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      cb(d);
    }
    window[name] = function(d){ finish(d); };
    sc.onerror = function(){ finish(null); };
    sc.src = RANK_URL + (RANK_URL.indexOf('?') >= 0 ? '&' : '?') +
             qs + '&callback=' + name + '&t=' + Date.now();
    document.head.appendChild(sc);
  }

  function put(k, d){ if (d) cache[k] = { at: Date.now(), data: d }; }
  function fresh(k){
    var c = cache[k];
    return (c && Date.now() - c.at < RANK_TTL) ? c.data : null;
  }

  /* 한 번에 전부 받아오기. 서버가 game=all 을 모르면 지네 순위(배열)가 오므로
     그걸로 구분해서 게임별 호출로 돌아갑니다. */
  function loadAll(cb){
    jsonp('game=all', function(d){
      if (d && !Array.isArray(d) && d.jine){
        put('jine', d.jine);
        put('najasin', d.najasin);
        put('selflove', d.selflove);
        put('whale_phone', d.whale_phone);
        put('whale_key', d.whale_key);
        put('forklift', d.forklift);
        put('floor3', d.floor3);
        allState = 1;
      } else {
        if (Array.isArray(d)) put('jine', d);   // 구버전 서버가 돌려준 지네 순위
        allState = 2;
      }
      cb();
    });
  }

  function dataKey(key){
    return key === 'whale' ? 'whale_' + whaleMode : key;
  }

  function need(key, cb){
    var dk = dataKey(key);
    var hit = fresh(dk);
    if (hit) { cb(hit); return; }

    if (allState === 0) {
      loadAll(function(){
        var got = fresh(dk);
        if (got) cb(got); else one(dk, cb);
      });
      return;
    }
    one(dk, cb);
  }

  function one(dk, cb){
    var qs = dk === 'whale_phone' ? 'game=whale&mode=phone'
           : dk === 'whale_key'   ? 'game=whale&mode=key'
           : 'game=' + dk;
    jsonp(qs, function(d){ put(dk, d); cb(d); });
  }

  /* ── 표 그리기 */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function comma(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtSec(v){
    var m = Math.floor(v / 60), r = v - m * 60;
    return m ? m + '분 ' + r.toFixed(1) + '초' : r.toFixed(1) + '초';
  }
  function fmtTime(t){
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }
  function note(msg){ return '<p class="note">' + esc(msg) + '</p>'; }
  function fail(){
    return '<div class="note"><b>지금은 순위를 불러오지 못했습니다</b>' +
           '<button class="mini" id="rankRetry" type="button">다시 시도</button></div>';
  }
  function rk(n){
    var g = n <= 3 ? ' g' + n : '';
    return '<i class="rk' + g + '">' + n + '</i>';
  }
  function myName(key){
    var b = boardOf(key);
    if (!b || !b.me) return '';
    try { return (localStorage.getItem(b.me) || '').trim(); } catch (e) { return ''; }
  }
  function table(head, body){
    return '<table class="bd"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
  }

  /* 지네 · 나자신 · 사랑 — 값이 클수록 위. 동점은 공동 순위. */
  function drawScore(list, unit, col, mine){
    if (!list || !list.length) return note('아직 기록이 없습니다');
    var body = '', r = 0, prev = null, n = Math.min(list.length, RANK_MAX);
    for (var i = 0; i < n; i++){
      var v = Number(list[i].d) || 0;
      if (v !== prev){ r = i + 1; prev = v; }
      var nm = String(list[i].n || '');
      body += '<tr' + (mine && nm === mine ? ' class="mine"' : '') + '>' +
                '<td class="r">' + rk(r) + '</td>' +
                '<td class="nm"><span>' + esc(nm) + '</span></td>' +
                '<td class="num">' + comma(v) + unit + '</td>' +
              '</tr>';
    }
    return table('<th class="r"></th><th>이름</th><th class="num">' + col + '</th>', body);
  }

  /* 고래 — 죽이는 데 걸린 시간이 짧을수록 위 */
  function drawWhale(list, mine){
    var seg = '<div class="seg">' +
      '<button class="tab' + (whaleMode === 'phone' ? ' on' : '') + '" data-wm="phone" type="button">폰</button>' +
      '<button class="tab' + (whaleMode === 'key'   ? ' on' : '') + '" data-wm="key" type="button">키보드</button>' +
      '</div>';
    if (!list || !list.length) return seg + note('아직 기록이 없습니다');

    var body = '', r = 0, prev = null, n = Math.min(list.length, RANK_MAX);
    for (var i = 0; i < n; i++){
      var t = Number(list[i].time) || 0;
      if (t !== prev){ r = i + 1; prev = t; }
      var nm = String(list[i].name || '');
      body += '<tr' + (mine && nm === mine ? ' class="mine"' : '') + '>' +
                '<td class="r">' + rk(r) + '</td>' +
                '<td class="nm"><span>' + esc(nm) + '</span></td>' +
                '<td class="num">' + fmtSec(t) + '</td>' +
                '<td class="num">' + comma(Number(list[i].score) || 0) + '문장</td>' +
              '</tr>';
    }
    return seg + table('<th class="r"></th><th>이름</th><th class="num">소요</th><th class="num">문장</th>', body);
  }

  /* 지게차 — 수료 점수와 속도전을 이름으로 합칩니다 (게임 안의 기록판과 같은 규칙) */
  function drawForklift(d){
    var certs = (d && d.certs) || [], rush = (d && d.rush) || [];
    if (!certs.length && !rush.length) return note('아직 기록이 없습니다');

    var by = {}, list = [], i, k, r;
    function get(n){
      if (!by[n]) { by[n] = { name:n, score:null, rush:null }; list.push(by[n]); }
      return by[n];
    }
    for (i = 0; i < certs.length; i++){
      r = get(String(certs[i].name));
      if (r.score === null || certs[i].score > r.score) r.score = Number(certs[i].score) || 0;
    }
    for (i = 0; i < rush.length; i++){
      r = get(String(rush[i].name));
      if (r.rush === null || rush[i].total < r.rush) r.rush = Number(rush[i].total) || 0;
    }
    list.sort(function(a, b){
      if ((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
      return (a.rush === null ? 1e9 : a.rush) - (b.rush === null ? 1e9 : b.rush);
    });

    var body = '', n = Math.min(list.length, RANK_MAX);
    for (i = 0; i < n; i++){
      body += '<tr>' +
                '<td class="r">' + rk(i + 1) + '</td>' +
                '<td class="nm"><span>' + esc(list[i].name) + '</span></td>' +
                '<td class="num">' + (list[i].score === null ? '-' : list[i].score + '점') + '</td>' +
                '<td class="num">' + (list[i].rush === null ? '-' : fmtTime(list[i].rush)) + '</td>' +
              '</tr>';
    }
    return table('<th class="r"></th><th>이름</th><th class="num">수료 점수</th><th class="num">속도전</th>', body);
  }

  /* 3층 — 순위가 아니라 명단 */
  function drawFloor3(d){
    var rows = (d && d.rows) || [];
    if (!rows.length) return note('아직 기록이 없습니다');
    var body = '', n = Math.min(rows.length, RANK_MAX);
    for (var i = 0; i < n; i++){
      body += '<tr>' +
                '<td class="num" style="text-align:left">' + (Number(rows[i].day) || 0) + '일차</td>' +
                '<td class="nm"><span>' + esc(rows[i].who) + '</span></td>' +
                '<td>' + esc(rows[i].reason) + '</td>' +
                '<td class="num">' + esc(rows[i].date) + '</td>' +
              '</tr>';
    }
    return table('<th>일차</th><th>이름</th><th>사유</th><th class="num">날짜</th>', body);
  }

  function draw(key, d){
    if (d === null || d === undefined) return fail();
    if (key === 'jine')     return drawScore(d, 'm', '거리', myName(key));
    if (key === 'najasin')  return drawScore(d, '명', '도망친 인원', myName(key));
    if (key === 'selflove') return drawScore(d, '회', '사랑해준 횟수', myName(key));
    if (key === 'whale')    return drawWhale(d, myName(key));
    if (key === 'forklift') return drawForklift(d);
    if (key === 'floor3')   return drawFloor3(d);
    return fail();
  }

  /* ── 화면 */
  function boardOf(key){
    for (var i = 0; i < BOARDS.length; i++) if (BOARDS[i].key === key) return BOARDS[i];
    return null;
  }

  function buildTabs(){
    tabsEl.innerHTML = '';
    BOARDS.forEach(function(b){
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'tab' + (b.key === cur ? ' on' : '');
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', b.key === cur ? 'true' : 'false');
      t.style.setProperty('--chip', b.chip);
      t.innerHTML = esc(b.name);
      t.addEventListener('click', function(){ show(b.key); });
      tabsEl.appendChild(t);
    });
  }

  function markTabs(){
    var list = tabsEl.children;
    for (var i = 0; i < list.length; i++){
      var on = BOARDS[i].key === cur;
      list[i].className = 'tab' + (on ? ' on' : '');
      list[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  function show(key){
    cur = key;
    markTabs();
    var my = ++seq;
    var cached = fresh(dataKey(key));
    if (!cached) rowsEl.innerHTML = note('불러오는 중');
    rowsEl.scrollTop = 0;
    need(key, function(d){
      if (my !== seq) return;
      rowsEl.innerHTML = draw(key, d);
    });
  }

  rowsEl.addEventListener('click', function(e){
    var wm = e.target.closest ? e.target.closest('[data-wm]') : null;
    if (wm){ whaleMode = wm.getAttribute('data-wm'); show('whale'); return; }
    if (e.target.id === 'rankRetry'){ cache = {}; show(cur); }
  });

  reloadB.addEventListener('click', function(){
    cache = {};
    allState = 0;
    show(cur);
  });

  /* ── 열고 닫기 */
  var scrollY = 0;
  function open(){
    scrollY = window.scrollY || 0;
    ovl.classList.add('on');
    btn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    window.__rankOpen = true;          // 얼굴 렌더링을 잠시 멈춥니다
    show(cur);
    closeB.focus();
  }
  function close(){
    ovl.classList.remove('on');
    btn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    window.__rankOpen = false;
    btn.focus();
    window.scrollTo(0, scrollY);
  }

  btn.addEventListener('click', open);
  closeB.addEventListener('click', close);
  ovl.addEventListener('click', function(e){ if (e.target === ovl) close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ovl.classList.contains('on')) close();
  });

  buildTabs();
})();

  wail.scale.set(1.0, 1.15, 0.35);
  cry.add(wail);

  // 눈물 — 눈꼬리에서 흘러내린다
  var tears = new THREE.Group();
  tears.visible = false;
  head.add(tears);

  var TEAR_N = 5;
  var drops = [];
  [-1, 1].forEach(function (s) {
    for (var i = 0; i < TEAR_N; i++) {
      var d = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 12), TEAR);
      d.scale.set(1, 1.5, 0.8);
      d.userData = { side: s, offset: i / TEAR_N };
      tears.add(d);
      drops.push(d);
    }
  });

  // 노려보는 얼굴 — 세 대 넘게 맞으면
  var angry = new THREE.Group();
  angry.visible = false;
  head.add(angry);

  [-1, 1].forEach(function (s) {
    var eyeA = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 20), INK);
    eyeA.position.set(0.365 * s, 0.11, 0.855);
    eyeA.scale.set(1.02, 1.42, 0.55);
    angry.add(eyeA);

    // 안쪽이 내려온 눈썹
    var browA = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.062, 0.07), INK);
    browA.position.set(0.375 * s, 0.42, 0.85);
    browA.rotation.z = 0.40 * s;
    browA.rotation.x = -0.18;
    angry.add(browA);

    var flush = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), MAD);
    flush.position.set(0.52 * s, -0.16, 0.74);
    flush.scale.set(1.0, 0.80, 0.24);
    angry.add(flush);
  });

  // 앙다문 입
  var grim = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.045, 12, 32, Math.PI), INK);
  grim.position.set(0, -0.34, 0.88);
  grim.rotation.x = -0.16;
  angry.add(grim);

  // 조는 얼굴
  var sleep = new THREE.Group();
  sleep.visible = false;
  head.add(sleep);

  [-1, 1].forEach(function (s) {
    var lid = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.036, 10, 26, Math.PI), INK);
    lid.position.set(0.365 * s, 0.09, 0.855);
    lid.rotation.z = Math.PI;
    lid.rotation.x = -0.14;
    sleep.add(lid);

    var browS = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.05, 0.07), INK);
    browS.position.set(0.375 * s, 0.39, 0.86);
    browS.rotation.z = -0.05 * s;
    browS.rotation.x = -0.18;
    sleep.add(browS);
  });

  var doze = new THREE.Mesh(new THREE.SphereGeometry(0.10, 20, 16), INK);
  doze.position.set(0, -0.38, 0.87);
  doze.scale.set(1.15, 0.9, 0.35);
  sleep.add(doze);

  // 콧방울
  var bubble = new THREE.Mesh(new THREE.SphereGeometry(0.12, 22, 18), SNOT);
  bubble.position.set(0.17, -0.17, 0.99);
  bubble.visible = false;
  sleep.add(bubble);

  // 목
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.52, 0.9, 28), SKIN);
  neck.position.set(0, -1.32, -0.02);
  head.add(neck);

  /* 상태 */
  var IDLE = 0.55;          // 기본 회전 속도(rad/s)
  var TAU = 1.35;           // 감속 시정수(s)
  var DIZZY_IN = 7.0;
  var DIZZY_OUT = 3.0;
  var CRY_TIME = 2.6;       // 우는 시간(s)
  var ANGRY_TIME = 2.4;     // 노려보는 시간(s)
  var HIT_TIME = 0.42;      // 맞고 휘청이는 시간(s)
  var COMBO = 1.6;          // 연타로 치는 간격(s)
  var HIDE_TOTAL = 3.4;     // 숨었다 나오는 전체 시간(s)
  var SLEEP_AFTER = 30;     // 이만큼 안 건드리면 존다(s)

  var angle = 0;
  var vel = reduced ? 0 : IDLE;
  var pitch = 0;
  var dragging = false;
  var pointerId = null;
  var lastX = 0, lastY = 0, lastT = 0;
  var dragVel = 0;
  var movedX = 0, movedY = 0, downT = 0;
  var isDizzy = false;
  var dizzyHold = 0;
  var cryT = 0, hitT = 0, angryT = 0, hideT = 0, wakeT = 0;
  var hits = 0, lastHit = -99;
  var clock = 0, lastAct = 0;
  var sleeping = false;
  var blinkWait = 2.6, blinking = 0;
  var gazeYaw = null, gazePitch = 0;

  function resize() {
    var w = hole.clientWidth || 320;
    renderer.setSize(w, w, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function wake() {
    lastAct = clock;
    if (sleeping) { sleeping = false; wakeT = 0.5; }
  }

  function punch() {
    if (hideT > 0) return;
    wake();
    if (clock - lastHit > COMBO) hits = 0;
    hits++;
    lastHit = clock;
    hitT = HIT_TIME;
    isDizzy = false;

    if (hits >= 5) {            // 더 때리면 구멍 아래로 숨는다
      hideT = HIDE_TOTAL;
      hits = 0;
      cryT = 0; angryT = 0;
    } else if (hits >= 3) {     // 연타면 노려본다
      angryT = ANGRY_TIME;
      cryT = 0;
      vel += (vel >= 0 ? 1.2 : -1.2);
    } else {                    // 한두 대는 운다
      cryT = CRY_TIME;
      vel += (vel >= 0 ? 2.2 : -2.2);
    }
  }

  stage.addEventListener('pointerdown', function (e) {
    if (pointerId !== null) return;
    pointerId = e.pointerId;
    dragging = true;
    dragVel = 0;
    movedX = 0;
    movedY = 0;
    downT = performance.now();
    lastX = e.clientX;
    lastY = e.clientY;
    lastT = downT;
    gazeYaw = null;
    wake();
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener('pointermove', function (e) {
    if (!dragging || e.pointerId !== pointerId) return;
    var now = performance.now();
    var dx = e.clientX - lastX;
    var dt = Math.max((now - lastT) / 1000, 1 / 240);
    movedX += Math.abs(dx);
    movedY += Math.abs(e.clientY - lastY);
    angle += dx * 0.011;
    dragVel = dragVel * 0.55 + (dx * 0.011 / dt) * 0.45;
    lastX = e.clientX;
    lastY = e.clientY;
    lastT = now;
    lastAct = clock;
  });

  function endDrag(e, cancelled) {
    if (e.pointerId !== pointerId) return;
    dragging = false;
    pointerId = null;
    stage.classList.remove('dragging');
    if (cancelled) return;   // 세로 스크롤로 넘어간 경우 — 때린 게 아니다
    // 거의 안 움직이고 짧게 눌렀으면 때린 것으로 친다
    if (movedX < 9 && movedY < 12 && performance.now() - downT < 350) punch();
    else vel = Math.max(-40, Math.min(40, dragVel));
  }
  stage.addEventListener('pointerup', function (e) { endDrag(e, false); });
  stage.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  /* 버튼을 건드리면 그쪽을 쳐다본다 */
  function gazeAt(el) {
    var s = stage.getBoundingClientRect();
    var b = el.getBoundingClientRect();
    var span = Math.max(s.width, 1);
    var dx = (b.left + b.width / 2) - (s.left + s.width / 2);
    var dy = (b.top + b.height / 2) - (s.top + s.height / 2);
    gazeYaw = Math.atan2((dx / span) * 1.7, 1.05);
    gazePitch = -Math.min(0.32, Math.max(0.08, (dy / span) * 0.30));
    wake();
  }
  function gazeOff() { gazeYaw = null; }

  Array.prototype.forEach.call(document.querySelectorAll('a.game, #rankBtn'), function (el) {
    el.addEventListener('pointerenter', function () { if (!dragging) gazeAt(el); });
    el.addEventListener('pointerdown',  function () { gazeAt(el); });
    el.addEventListener('focus',        function () { gazeAt(el); });
    el.addEventListener('pointerleave', gazeOff);
    el.addEventListener('blur',         gazeOff);
  });

  var prev = performance.now();

  function frame(now) {
    // 순위판이 덮고 있는 동안에는 그리지 않습니다
    if (window.__rankOpen) { prev = now; requestAnimationFrame(frame); return; }

    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    clock += dt;

    if (cryT > 0)   cryT -= dt;
    if (angryT > 0) angryT -= dt;
    if (hitT > 0)   hitT -= dt;
    if (hideT > 0)  hideT -= dt;
    if (wakeT > 0)  wakeT -= dt;

    var hiding = hideT > 0;
    var busy = hiding || angryT > 0 || cryT > 0 || dragging || gazeYaw !== null;

    if (!busy && !reduced && clock - lastAct > SLEEP_AFTER) sleeping = true;

    /* 회전 */
    if (dragging) {
      // pointermove 에서 angle 을 직접 돌린다
    } else if (hiding) {
      vel *= Math.exp(-dt / 0.25);
      var front = 2 * Math.PI * Math.round(angle / (2 * Math.PI));
      angle += (front - angle) * Math.min(1, dt * 7);
    } else if (gazeYaw !== null) {
      vel *= Math.exp(-dt / 0.20);
      var tgt = gazeYaw + 2 * Math.PI * Math.round((angle - gazeYaw) / (2 * Math.PI));
      angle += (tgt - angle) * Math.min(1, dt * 9);
    } else {
      var target = reduced ? 0 : (sleeping ? 0.16 : IDLE);
      vel = target + (vel - target) * Math.exp(-dt / TAU);
      angle += vel * dt;
    }

    var wantPitch = (gazeYaw !== null && !dragging && !hiding) ? gazePitch : 0;
    pitch += (wantPitch - pitch) * Math.min(1, dt * 8);

    /* 표정 */
    var speed = Math.abs(dragging ? dragVel : vel);
    if (!hiding && cryT <= 0 && angryT <= 0 && !sleeping) {
      if (!isDizzy && speed > DIZZY_IN) { isDizzy = true; dizzyHold = 0.8; }
      if (isDizzy) {
        dizzyHold -= dt;
        if (speed < DIZZY_OUT && dizzyHold <= 0) isDizzy = false;
      }
    } else {
      isDizzy = false;
    }

    var mode;
    if (hiding || angryT > 0) mode = 'angry';
    else if (cryT > 0)        mode = 'cry';
    else if (sleeping)        mode = 'sleep';
    else if (isDizzy)         mode = 'dizzy';
    else                      mode = 'calm';

    calm.visible  = (mode === 'calm');
    dizzy.visible = (mode === 'dizzy');
    cry.visible   = (mode === 'cry');
    angry.visible = (mode === 'angry');
    sleep.visible = (mode === 'sleep');
    tears.visible = (mode === 'cry');

    /* 눈 깜빡임 */
    if (mode === 'calm') {
      blinkWait -= dt;
      if (blinkWait <= 0 && blinking <= 0) { blinking = 0.14; blinkWait = 2.4 + Math.random() * 4.2; }
      if (blinking > 0) blinking -= dt;
      var k = blinking > 0 ? 1 - Math.sin(Math.PI * (blinking / 0.14)) * 0.9 : 1;
      for (var b = 0; b < calmEyes.length; b++) calmEyes[b].scale.set(0.95, 1.18 * k, 0.55);
    }

    /* 눈물 */
    if (mode === 'cry') {
      var fade = Math.min(1, cryT / 0.6);
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        var p = (clock * 0.85 + d.userData.offset) % 1;
        d.position.set(
          0.50 * d.userData.side + p * 0.05 * d.userData.side,
          0.02 - p * 1.35,
          0.82 - p * 0.20
        );
        var grow = Math.min(1, p * 5);
        d.scale.set(grow, 1.5 * grow, 0.8 * grow);
        d.material.opacity = 0.9 * fade;
      }
    }

    /* 콧방울 */
    if (mode === 'sleep') {
      var bp = (clock % 4.2) / 4.2;
      var g = bp < 0.86 ? bp / 0.86 : 0;
      bubble.visible = g > 0.04;
      bubble.scale.setScalar(0.2 + g * 1.05);
    } else {
      bubble.visible = false;
    }

    /* 자세 */
    var y = -0.05 + (mode === 'sleep' ? 0 : Math.sin(clock * 1.05) * 0.018);
    var rz = 0, rx = pitch, px = 0;

    if (hiding) {
      var e = HIDE_TOTAL - hideT;
      var drop;
      if (e < 0.40)      drop = -2.55 * (e / 0.40);                       // 쏙 내려간다
      else if (e < 1.35) drop = -2.55;                                    // 숨어 있는다
      else if (e < 1.75) drop = -2.55 + 1.35 * ((e - 1.35) / 0.40);       // 눈만 빼꼼
      else if (e < 2.65) drop = -1.20 + Math.sin(clock * 3.2) * 0.03;
      else               drop = -1.20 * (1 - Math.min(1, (e - 2.65) / 0.75));
      y += drop;
      rz = 0;
      rx = 0;
    } else if (hitT > 0) {
      var kk = hitT / HIT_TIME;
      rz = Math.sin(hitT * 48) * 0.30 * kk;
      px = Math.sin(hitT * 42) * 0.17 * kk;
      y += Math.sin(hitT * 36) * 0.07 * kk;
    } else if (mode === 'cry') {
      rz = Math.sin(clock * 7.5) * 0.05;
      y += -0.05 + Math.abs(Math.sin(clock * 5.2)) * 0.05;
    } else if (mode === 'angry') {
      rz = Math.sin(clock * 26) * 0.014;
      y += Math.sin(clock * 24) * 0.008;
    } else if (mode === 'sleep') {
      var nod = Math.sin(clock * 1.5);
      rz = 0.13 + Math.sin(clock * 0.7) * 0.03;
      rx += 0.11 + Math.max(0, nod) * 0.13;
      y += -0.03 - Math.max(0, nod) * 0.06;
    } else if (mode === 'dizzy') {
      rz = Math.sin(now / 90) * 0.075;
      y += Math.sin(now / 62) * 0.035;
    }

    if (wakeT > 0) y += Math.sin(wakeT * 30) * 0.11 * (wakeT / 0.5);

    head.rotation.y = angle;
    head.rotation.z += (rz - head.rotation.z) * Math.min(1, dt * 14);
    head.rotation.x += (rx - head.rotation.x) * Math.min(1, dt * 10);
    head.position.x += (px - head.position.x) * Math.min(1, dt * 16);
    head.position.y += (y - head.position.y) * Math.min(1, dt * 14);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
