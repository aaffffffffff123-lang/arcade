<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='43' rx='25' ry='15' fill='%23111820' stroke='%231A3E8C' stroke-width='6'/%3E%3Cpath d='M32 39L43 18' stroke='%23F26B1D' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='14' r='9' fill='%23F26B1D' stroke='%231B2430' stroke-width='4'/%3E%3C/svg%3E">
  <title>혐규오락실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  :root{
    --floor:#E7EAE6;
    --floor-line:#D3D8D2;
    --ink:#1B2430;
    --paper:#FFFFFF;
    --blue:#1A3E8C;
    --blue-dark:#122C64;
    --hole:#B9C0BA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--floor);
    background-image:
      linear-gradient(var(--floor-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--floor-line) 1px, transparent 1px);
    background-size:72px 72px;
    color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;
    justify-content:center;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .shell{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}

  .top{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .brand{
    font-weight:800;
    font-size:20px;
    letter-spacing:-0.04em;
    line-height:1;
    padding:8px 12px;
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:4px 4px 0 var(--ink);
    color:var(--ink);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:4px;
    transition:transform .06s ease, box-shadow .06s ease;
  }

  .brand-tag{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:900;line-height:1;letter-spacing:0;color:#E0301E;}

  a.brand[href]:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  a.brand[href]:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 순위 버튼 */
  .rankbtn{
    flex:none;
    display:grid;
    place-items:center;
    width:54px;
    height:42px;
    padding:0;
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:4px 4px 0 var(--ink);
    cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .rankbtn svg{display:block;width:24px;height:18px;}
  .rankbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .rankbtn:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

  /* 소리 아이콘 버튼 */
  .soundbtn{
    flex:none;
    display:grid;
    place-items:center;
    width:42px;
    height:42px;
    padding:4px;
    border:0;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    line-height:0;
    filter:drop-shadow(2px 2px 0 #AAB3AC);
    transition:transform .06s ease, filter .06s ease, opacity .06s ease;
  }

  .soundbtn svg{
    display:block;
    width:31px;
    height:31px;
    overflow:visible;
  }

  .soundbtn:active{
    transform:translate(2px,2px);
    filter:none;
  }

  .soundbtn:focus-visible{
    outline:3px solid var(--blue);
    outline-offset:1px;
    border-radius:50%;
  }

  .soundbtn:disabled{
    opacity:.35;
    cursor:default;
  }


  /* 순위판 */
  .ovl{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(27,36,48,.42);
  }
  .ovl.on{display:flex;}
  @media (min-width:600px){ .ovl{align-items:center;} }

  .sheet{
    width:100%;
    max-width:560px;
    max-height:86dvh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    animation:rise .16s ease-out;
  }
  @keyframes rise{from{transform:translateY(16px);opacity:.3;} to{transform:none;opacity:1;}}

  .sheet-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:3px solid var(--ink);
  }
  .sheet-top h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.04em;}
  .sheet-act{display:flex;gap:8px;align-items:center;}

  .mini{
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font:inherit;
    font-size:13px;
    font-weight:800;
    line-height:1;
    padding:7px 9px;
    cursor:pointer;
  }
  .mini:active{transform:translate(2px,2px);}
  .mini:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .mini.x{width:34px;}

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:12px 14px;
    border-bottom:2px solid #DCE0DB;
  }
  @media (min-width:600px){ .tabs{grid-template-columns:1fr 1fr 1fr;} }
  .tab{
    display:flex;
    align-items:center;
    min-width:0;
    border:2px solid var(--ink);
    border-left:6px solid var(--chip, var(--ink));
    background:var(--paper);
    color:var(--ink);
    font:inherit;
    font-size:13.5px;
    font-weight:800;
    letter-spacing:-0.04em;
    line-height:1;
    padding:9px 8px;
    cursor:pointer;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tab.on{background:var(--ink);color:#FFFFFF;}
  .tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  @media (max-width:340px){ .tab{font-size:12.5px;padding:9px 6px;} }

  .rows{overflow-y:auto;padding:2px 14px 18px;-webkit-overflow-scrolling:touch;}
  .seg{display:flex;gap:8px;padding:12px 0 2px;}
  .seg .tab{flex:1 1 0;border-left:2px solid var(--ink);justify-content:center;}
  .note{padding:26px 2px;color:#6B7480;font-size:15px;}
  .note b{display:block;color:var(--ink);font-size:15px;margin-bottom:10px;}

  .bd{width:100%;border-collapse:collapse;}
  .bd th{
    position:sticky;
    top:0;
    background:var(--paper);
    font-size:12px;
    font-weight:700;
    color:#6B7480;
    text-align:left;
    padding:10px 6px;
    border-bottom:2px solid var(--ink);
  }
  .bd td{padding:9px 6px;border-bottom:1px solid #E1E5E0;font-size:15px;}
  .bd .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bd .r{width:36px;padding-right:0;}
  .bd .nm span{
    display:block;
    max-width:10.5em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:700;
  }
  .bd tr.mine td{background:#FFF3CE;}
  .rk{
    display:grid;
    place-items:center;
    width:26px;
    height:24px;
    border:2px solid var(--ink);
    font-size:12px;
    font-weight:800;
    font-style:normal;
    font-variant-numeric:tabular-nums;
  }
  .rk.g1{background:#FFC400;}
  .rk.g2{background:#D7DDE2;}
  .rk.g3{background:#E2A46A;}

  .stage{
    margin:clamp(22px,6vh,48px) 0 clamp(24px,5vh,40px);
    width:min(74vw,44vh,360px);
    aspect-ratio:1/1;
    position:relative;
    touch-action:pan-y;   /* 세로 스크롤은 브라우저에, 가로 제스처만 받는다 */
    cursor:grab;
  }
  .stage.dragging{cursor:grabbing;}

  /* 바닥에 뚫린 구멍 */
  .hole{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #F7F8F5 0%, #E2E6E1 58%, #B3BAB3 100%);
    overflow:hidden;
    box-shadow:inset 0 14px 26px rgba(27,36,48,.34), inset 0 -6px 14px rgba(27,36,48,.12);
    animation:breathe 5.9s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{box-shadow:inset 0 14px 26px rgba(27,36,48,.34), inset 0 -6px 14px rgba(27,36,48,.12);}
    50%    {box-shadow:inset 0 17px 30px rgba(27,36,48,.40), inset 0 -5px 12px rgba(27,36,48,.10);}
  }
  .hole canvas{display:block;width:100%;height:100%;}

  /* 개구부 둘레 */
  .rim{
    position:absolute;
    inset:-13px;
    border-radius:50%;
    padding:13px;
    background:var(--blue);
    -webkit-mask:radial-gradient(circle, transparent calc(50% - 13px), #000 calc(50% - 13px));
    mask:radial-gradient(circle, transparent calc(50% - 13px), #000 calc(50% - 13px));
    pointer-events:none;
  }
  .rim::after{
    content:"";
    position:absolute;
    inset:13px;
    border-radius:50%;
    box-shadow:0 0 0 3px var(--blue-dark);
  }

  .games{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .game{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    min-height:116px;
    padding:20px 14px 15px;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    text-decoration:none;
    color:var(--ink);
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.04em;
    line-height:1.25;
    word-break:keep-all;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .game::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:9px;
    background:var(--chip);
  }
  .game .ico{width:40px;height:30px;display:block;flex:none;}
  .game small{
    display:block;
    margin-top:5px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:-0.02em;
    color:#6B7480;
  }
  .game:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
  .game:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}
  .game[aria-disabled="true"]{opacity:.42;pointer-events:none;}

  .game.blank{
    background:transparent;
    border-style:dashed;
    border-color:#B4BCB4;
    box-shadow:none;
    pointer-events:none;
  }
  .game.blank::before{display:none;}

  .homebtn{
  position:absolute;
  left:-18px;
  bottom:-18px;
  z-index:5;
  display:block;
  width:56px;
  height:56px;
  line-height:0;
  filter:drop-shadow(5px 5px 0 #AAB3AC);
  transition:transform .06s ease, filter .06s ease;
}
.homebtn svg{display:block;width:100%;height:100%;}
.homebtn:active{transform:translate(5px,5px);filter:drop-shadow(0 0 0 #AAB3AC);}
.homebtn:focus-visible{outline:4px solid var(--blue);outline-offset:4px;border-radius:50%;}
@media (max-width:360px){ .homebtn{width:50px;height:50px;left:-15px;bottom:-15px;} }

/* 오락기 동전 투입구 */
.coinbtn{
  position:absolute;
  right:-18px;
  bottom:-18px;
  z-index:5;
  width:56px;
  height:56px;
  padding:0;
  border:0;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  line-height:0;
  filter:drop-shadow(5px 5px 0 #AAB3AC);
  transition:transform .06s ease, filter .06s ease;
}
.coinbtn svg{display:block;width:48px;height:48px;overflow:visible;margin:auto;}
.coinbtn:active{transform:translate(5px,5px);filter:none;}
.coinbtn:focus-visible{outline:4px solid var(--blue);outline-offset:4px;border-radius:50%;}
@media (max-width:360px){
  .coinbtn{width:50px;height:50px;right:-15px;bottom:-15px;}
  .coinbtn svg{width:44px;height:44px;}
}

/* 후원 확인창 */
.support-ovl{
  position:fixed;
  inset:0;
  z-index:70;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(27,36,48,.42);
}
.support-ovl[hidden]{display:none;}
.support-sheet{
  width:min(100%,320px);
  padding:24px;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);
  animation:rise .16s ease-out;
}
.support-sheet h2{
  margin:0 0 22px;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.04em;
}
.support-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.support-choice{
  min-height:46px;
  display:grid;
  place-items:center;
  padding:10px 12px;
  border:3px solid var(--ink);
  background:var(--paper);
  box-shadow:3px 3px 0 var(--ink);
  color:var(--ink);
  font:inherit;
  font-size:15px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
  transition:transform .06s ease, box-shadow .06s ease;
}
.support-choice.go{background:#FFC400;}
.support-choice:active{transform:translate(3px,3px);box-shadow:none;}
.support-choice:focus-visible{outline:4px solid var(--blue);outline-offset:3px;}

@media (prefers-reduced-motion:reduce){

    .game,.brand,.rankbtn,.coinbtn,.support-choice{transition:none;}
    .hole{animation:none;}
    .sheet,.support-sheet{animation:none;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a class="brand" id="brand" aria-label="혐규오락실"><span class="brand-tag" aria-hidden="true"><span>혐</span><span>규</span></span>오락실</a>
    <button class="rankbtn" id="rankBtn" type="button"
            aria-label="순위" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 18" aria-hidden="true">
        <g stroke="#1B2430" stroke-width="1.5">
          <rect x="0.8" y="0.9"  width="22.4" height="4" fill="#FFC400"/>
          <rect x="0.8" y="7"    width="22.4" height="4" fill="#D7DDE2"/>
          <rect x="0.8" y="13.1" width="22.4" height="4" fill="#E2A46A"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="hole" id="hole"></div>
    <div class="rim"></div>
    <a class="homebtn" id="homeBtn" target="_top" aria-label="혐규만화">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24.00 2.84 C27.19 2.93 30.48 3.49 33.44 4.70 C36.39 5.91 39.79 7.65 41.72 10.08 C43.64 12.51 44.41 16.18 44.97 19.28 C45.53 22.39 45.73 25.72 45.08 28.74 C44.42 31.76 43.07 35.11 41.06 37.40 C39.05 39.69 35.87 41.15 33.03 42.47 C30.19 43.79 27.09 45.14 24.00 45.31 C20.91 45.47 17.40 44.72 14.49 43.46 C11.58 42.19 8.30 40.21 6.54 37.72 C4.78 35.22 4.45 31.57 3.93 28.51 C3.41 25.45 2.76 22.23 3.42 19.37 C4.08 16.52 6.10 13.90 7.91 11.36 C9.72 8.82 11.61 5.56 14.29 4.14 C16.97 2.72 20.81 2.75 24.00 2.84 Z" fill="#221D1F"/>
        <g stroke="#EFF1EC" stroke-width="1.9" stroke-linecap="round" fill="none">
          <path d="M13.2 8.4V17.9"/>
          <path d="M20.4 6.2V16.6"/>
          <path d="M27.6 6.2V16.6"/>
          <path d="M34.6 8.8V18.3"/>
        </g>
        <g fill="#EFF1EC">
          <ellipse cx="18.1" cy="25.2" rx="1.75" ry="2.05"/>
          <ellipse cx="29.9" cy="25.2" rx="1.75" ry="2.05"/>
        </g>
        <path d="M19.9 32.3a4.6 4.6 0 0 0 8.2 0" fill="none" stroke="#EFF1EC" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </a>
    <button class="coinbtn" id="coinBtn" type="button"
            aria-label="후원하기" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20.5" fill="#AAB3AC" stroke="#1B2430" stroke-width="3"/>
        <circle cx="24" cy="24" r="14.5" fill="#EFF1EC" stroke="#69747B" stroke-width="2"/>
        <path d="M24 11.5V36.5" fill="none" stroke="#1B2430" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <nav class="games" id="games"></nav>
</div>

<div class="support-ovl" id="supportOvl" hidden>
  <section class="support-sheet" role="dialog" aria-modal="true" aria-labelledby="supportTitle">
    <h2 id="supportTitle">후원하기.</h2>
    <div class="support-actions">
      <button class="support-choice" id="supportCancel" type="button">안 하기</button>
      <a class="support-choice go" id="supportGo"
         href="https://qr.kakaopay.com/Ej9SOogEu"
         target="_blank" rel="noopener noreferrer">하기</a>
    </div>
  </section>
</div>

<div class="ovl" id="ovl">
  <section class="sheet" role="dialog" aria-modal="true" aria-label="순위">
    <header class="sheet-top">
      <h2>순위</h2>
      <div class="sheet-act">
        <button class="mini" id="rankReload" type="button">새로고침</button>
        <button class="mini x" id="rankClose" type="button" aria-label="닫기">✕</button>
      </div>
    </header>
    <div class="tabs" id="rankTabs"></div>
    <div class="rows" id="rankRows"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─────────────────────────────────────────────
   사이트 첫 화면 주소를 넣으면 「오락실」 상자가 홈 링크가 됩니다.
   비워두면 지금처럼 그냥 상자로 남습니다.
   ───────────────────────────────────────────── */
var HOME_URL = '';
window.__arcadeSoundEnabled = true;

(function supportDialog(){
  var trigger = document.getElementById('coinBtn');
  var ovl = document.getElementById('supportOvl');
  var cancel = document.getElementById('supportCancel');

(function buildGames(){
  var wrap = document.getElementById('games');
  for (var i = 0; i < GAMES.length; i++) {
    var g = GAMES[i];

    if (!g.name) {
      var blank = document.createElement('div');
      blank.className = 'game blank';
      wrap.appendChild(blank);
      continue;
    }

    var a = document.createElement('a');
    a.className = 'game';
    a.style.setProperty('--chip', g.chip);
    a.innerHTML = g.icon;
    var label = document.createElement('span');
    label.textContent = g.name;
    if (g.desc) {
      var sub = document.createElement('small');
      sub.textContent = g.desc;
      label.appendChild(sub);
    }
    a.appendChild(label);

    if (g.url) {
      a.href = g.url;
      a.target = '_top';
    } else {
      a.setAttribute('aria-disabled', 'true');
      a.setAttribute('tabindex', '-1');
    }
    wrap.appendChild(a);
  }
})();

/* ─────────────────────────────────────────────

   비둘기 게임은 순위가 없어 탭이 없습니다.
   ───────────────────────────────────────────── */
var RANK_URL = 'https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec';
var RANK_TTL = 45000;   // 이 시간 안에 다시 열면 서버를 또 부르지 않습니다
var RANK_MAX = 100;     // 한 판에 보여줄 줄 수

(function rankPanel(){
  var ovl    = document.getElementById('ovl');
  var tabsEl = document.getElementById('rankTabs');
  var rowsEl = document.getElementById('rankRows');
  var btn    = document.getElementById('rankBtn');
  var closeB = document.getElementById('rankClose');
  var reloadB= document.getElementById('rankReload');

 var BOARDS = [
  { key:'jockey',   name:'자키 라이더',         chip:'#F26B1D', me:'jockey_nick' },
  { key:'selflove', name:'스스로를 사랑하기', chip:'#E8306B', me:'selflove_name' },
  { key:'najasin',  name:'나에게서 도망치기', chip:'#4A5766', me:'najasin_name' },
  { key:'whale',    name:'고래 칭찬하기',     chip:'#1E93B0', me:'whale_name' },
  { key:'jine',     name:'지네 못 걷기',      chip:'#C0563F', me:'jine_name' },
  { key:'forklift', name:'지게차 연수원',     chip:'#F2600C', me:'' },
  { key:'floor3',   name:'심야물류센터3층',   chip:'#FFC400', me:'' }
];

  var cache = {};              // 데이터키 → { at, data }
  var cur = BOARDS[0].key;
  var whaleMode = 'phone';
  var allState = 0;            // 0 안 해봄 · 1 됨 · 2 서버가 아직 모름
  var seq = 0;                 // 늦게 도착한 응답이 화면을 덮어쓰지 않게

  /* ── 통신 */
  function jsonp(qs, cb){
    var name = 'arc_' + Math.random().toString(36).slice(2);
    var sc = document.createElement('script');
    var done = false;
    var timer = setTimeout(function(){ finish(null); }, 12000);

    function finish(d){
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      cb(d);
    }
    window[name] = function(d){ finish(d); };
    sc.onerror = function(){ finish(null); };
    sc.src = RANK_URL + (RANK_URL.indexOf('?') >= 0 ? '&' : '?') +
             qs + '&callback=' + name + '&t=' + Date.now();
    document.head.appendChild(sc);
  }

  function put(k, d){ if (d) cache[k] = { at: Date.now(), data: d }; }
  function fresh(k){
    var c = cache[k];
    return (c && Date.now() - c.at < RANK_TTL) ? c.data : null;
  }

  /* 한 번에 전부 받아오기. 서버가 game=all 을 모르면 지네 순위(배열)가 오므로
     그걸로 구분해서 게임별 호출로 돌아갑니다. */
  function loadAll(cb){
    jsonp('game=all', function(d){
     if (d && !Array.isArray(d) && d.jine){
  put('jockey', d.jockey);
  put('jine', d.jine);
  put('najasin', d.najasin);
  put('selflove', d.selflove);
  put('whale_phone', d.whale_phone);
  put('whale_key', d.whale_key);
  put('forklift', d.forklift);
  put('floor3', d.floor3);
  allState = 1;
} else {
        if (Array.isArray(d)) put('jine', d);   // 구버전 서버가 돌려준 지네 순위
        allState = 2;
      }
      cb();
    });
  }

  function dataKey(key){
    return key === 'whale' ? 'whale_' + whaleMode : key;
  }

  function need(key, cb){
    var dk = dataKey(key);
    var hit = fresh(dk);
    if (hit) { cb(hit); return; }

    if (allState === 0) {
      loadAll(function(){
        var got = fresh(dk);
        if (got) cb(got); else one(dk, cb);
      });
      return;
    }
    one(dk, cb);
  }

  function one(dk, cb){
    var qs = dk === 'whale_phone' ? 'game=whale&mode=phone'
           : dk === 'whale_key'   ? 'game=whale&mode=key'
           : 'game=' + dk;
    jsonp(qs, function(d){ put(dk, d); cb(d); });
  }

  /* ── 표 그리기 */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function comma(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtSec(v){
    var m = Math.floor(v / 60), r = v - m * 60;
    return m ? m + '분 ' + r.toFixed(1) + '초' : r.toFixed(1) + '초';

/* 자키 라이더 — 멀리 갈수록 위 */
function drawJockey(list, mine){
  if (!list || !list.length) return note('아직 기록이 없습니다');

  var body = '';
  var r = 0;
  var prev = null;
  var n = Math.min(list.length, RANK_MAX);

  for (var i = 0; i < n; i++){
    var dist = Number(
      list[i].dist != null
        ? list[i].dist
        : list[i].score
    ) || 0;

    if (dist !== prev){

      prev = dist;
    }

    var nm = String(list[i].name || '');
    var pal = Number(list[i].pallets) || 0;

    body +=
      '<tr' + (mine && nm === mine ? ' class="mine"' : '') + '>' +
        '<td class="r">' + rk(r) + '</td>' +
        '<td class="nm"><span>' + esc(nm) + '</span></td>' +
        '<td class="num">' + comma(dist) + 'm</td>' +
        '<td class="num">' + pal + '단</td>' +

  return table(
    '<th class="r"></th>' +
    '<th>이름</th>' +
    '<th class="num">거리</th>' +

  /* 지게차 — 수료 점수와 속도전을 이름으로 합칩니다 (게임 안의 기록판과 같은 규칙) */
  function drawForklift(d){
    var certs = (d && d.certs) || [], rush = (d && d.rush) || [];
    if (!certs.length && !rush.length) return note('아직 기록이 없습니다');

    var by = {}, list = [], i, k, r;
    function get(n){
      if (!by[n]) { by[n] = { name:n, score:null, rush:null }; list.push(by[n]); }
      return by[n];
    }
    for (i = 0; i < certs.length; i++){
      r = get(String(certs[i].name));
      if (r.score === null || certs[i].score > r.score) r.score = Number(certs[i].score) || 0;
    }
    for (i = 0; i < rush.length; i++){
      r = get(String(rush[i].name));
      if (r.rush === null || rush[i].total < r.rush) r.rush = Number(rush[i].total) || 0;
    }
    list.sort(function(a, b){
      if ((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
      return (a.rush === null ? 1e9 : a.rush) - (b.rush === null ? 1e9 : b.rush);
    });

    var body = '', n = Math.min(list.length, RANK_MAX);
    for (i = 0; i < n; i++){
      body += '<tr>' +
                '<td class="r">' + rk(i + 1) + '</td>' +
                '<td class="nm"><span>' + esc(list[i].name) + '</span></td>' +
                '<td class="num">' + (list[i].score === null ? '-' : list[i].score + '점') + '</td>' +
                '<td class="num">' + (list[i].rush === null ? '-' : fmtTime(list[i].rush)) + '</td>' +
              '</tr>';
    }
    return table('<th class="r"></th><th>이름</th><th class="num">수료 점수</th><th class="num">속도전</th>', body);
  }

 function draw(key, d){
  if (d === null || d === undefined) return fail();

  if (key === 'jockey')   return drawJockey(d, myName(key));
  if (key === 'jine')     return drawScore(d, 'm', '거리', myName(key));
  if (key === 'najasin')  return drawScore(d, '명', '도망친 인원', myName(key));
  if (key === 'selflove') return drawScore(d, '회', '사랑해준 횟수', myName(key));
  if (key === 'whale')    return drawWhale(d, myName(key));
  if (key === 'forklift') return drawForklift(d);
  if (key === 'floor3')   return drawFloor3(d);

  return fail();
}

  /* ── 화면 */
  function boardOf(key){
    for (var i = 0; i < BOARDS.length; i++) if (BOARDS[i].key === key) return BOARDS[i];
    return null;
  }

  function buildTabs(){
    tabsEl.innerHTML = '';
    BOARDS.forEach(function(b){
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'tab' + (b.key === cur ? ' on' : '');
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', b.key === cur ? 'true' : 'false');
      t.style.setProperty('--chip', b.chip);
      t.innerHTML = esc(b.name);
      t.addEventListener('click', function(){ show(b.key); });
      tabsEl.appendChild(t);
    });
  }

  function markTabs(){
    var list = tabsEl.children;
    for (var i = 0; i < list.length; i++){
      var on = BOARDS[i].key === cur;
      list[i].className = 'tab' + (on ? ' on' : '');
      list[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  function show(key){
    cur = key;
    markTabs();
    var my = ++seq;
    var cached = fresh(dataKey(key));
    if (!cached) rowsEl.innerHTML = note('불러오는 중');
    rowsEl.scrollTop = 0;
    need(key, function(d){
      if (my !== seq) return;
      rowsEl.innerHTML = draw(key, d);
    });
  }

  rowsEl.addEventListener('click', function(e){
    var wm = e.target.closest ? e.target.closest('[data-wm]') : null;
    if (wm){ whaleMode = wm.getAttribute('data-wm'); show('whale'); return; }
    if (e.target.id === 'rankRetry'){ cache = {}; show(cur); }
  });

  reloadB.addEventListener('click', function(){
    cache = {};
    allState = 0;
    show(cur);
  });

  /* ── 열고 닫기 */
  var scrollY = 0;
  function open(){
    scrollY = window.scrollY || 0;
    ovl.classList.add('on');
    btn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
    window.__rankOpen = true;          // 얼굴 렌더링을 잠시 멈춥니다
    show(cur);
    closeB.focus();
  }
  function close(){
    ovl.classList.remove('on');
    btn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    window.__rankOpen = false;
    btn.focus();
    window.scrollTo(0, scrollY);
  }

  btn.addEventListener('click', open);
  closeB.addEventListener('click', close);
  ovl.addEventListener('click', function(e){ if (e.target === ovl) close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ovl.classList.contains('on')) close();
  });

  buildTabs();
})();

    function note(f0, f1, delay, duration, type){
      var t = chipCtx.currentTime + delay;
      var osc = chipCtx.createOscillator();
      var gain = chipCtx.createGain();

      osc.type = type || 'square';

      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(
        f1, t + duration
      );

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.23, t + 0.006);
      gain.gain.exponentialRampToValueAtTime(
        0.0001, t + duration
      );

      osc.connect(gain);
      gain.connect(chipGain);

      osc.start(t);
      osc.stop(t + duration + 0.02);

      osc.onended = function(){
        osc.disconnect();
        gain.disconnect();
      };
    }

      // 점프: 뿅!
      note(320, 1100, 0, 0.16);

    } else if (kind === 1){
      // 코인: 띠링!
      note(980, 980, 0, 0.055);
      note(1480, 1480, 0.065, 0.13);

    } else if (kind === 2){
      // 발사: 삐융!

    } else if (kind === 3){
      // 파워업: 또로로롱!

    }
  }

    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    clock += dt;

    if (cryT > 0)   cryT -= dt;
    if (angryT > 0) angryT -= dt;
    if (hitT > 0)   hitT -= dt;
    if (hideT > 0)  hideT -= dt;
    if (wakeT > 0)  wakeT -= dt;




       var hiding = hideT > 0;

    var busy =
      hiding ||
      angryT > 0 ||
      cryT > 0 ||
      hitT > 0 ||
      dragging ||
      signShown > 0.01 ||
      signPhase === 'rise' ||
      signPhase === 'hold';

    sleeping =
      !busy &&
      !reduced &&
      clock - lastAct > SLEEP_AFTER;

    /* 회전 */
    if (dragging) {
      // pointermove 에서 angle 을 직접 돌린다
    } else if (
      hiding ||
      sleeping ||
      signPhase === 'rise' ||
      signPhase === 'hold'
    ) {
      vel *= Math.exp(-dt / 0.25);
      var front = 2 * Math.PI * Math.round(angle / (2 * Math.PI));
      angle += (front - angle) * Math.min(1, dt * 7);
    } else {
      var target = reduced ? 0 : (sleeping ? 0.16 : IDLE);
      vel = target + (vel - target) * Math.exp(-dt / TAU);
      angle += vel * dt;
    }

  

    /* 표정 */
    var speed = Math.abs(dragging ? dragVel : vel);
    if (!hiding && cryT <= 0 && angryT <= 0 && !sleeping) {
      if (!isDizzy && speed > DIZZY_IN) { isDizzy = true; dizzyHold = 0.8; }
      if (isDizzy) {
        dizzyHold -= dt;
        if (speed < DIZZY_OUT && dizzyHold <= 0) isDizzy = false;
      }
    } else {
      isDizzy = false;
    }

    var mode;
    if (hiding || angryT > 0) mode = 'angry';
    else if (cryT > 0)        mode = 'cry';
    else if (sleeping)        mode = 'sleep';
    else if (isDizzy)         mode = 'dizzy';
    else                      mode = 'calm';

    calm.visible  = (mode === 'calm');
    dizzy.visible = (mode === 'dizzy');
    cry.visible   = (mode === 'cry');
    angry.visible = (mode === 'angry');
    sleep.visible = (mode === 'sleep');
    tears.visible = (mode === 'cry');

    /* 눈 깜빡임 */
    if (mode === 'calm') {
      blinkWait -= dt;
      if (blinkWait <= 0 && blinking <= 0) { blinking = 0.14; blinkWait = 2.4 + Math.random() * 4.2; }
      if (blinking > 0) blinking -= dt;
      var k = blinking > 0 ? 1 - Math.sin(Math.PI * (blinking / 0.14)) * 0.9 : 1;
      for (var b = 0; b < calmEyes.length; b++) calmEyes[b].scale.set(0.95, 1.18 * k, 0.55);
    }

    /* 눈물 */
    if (mode === 'cry') {
      var fade = Math.min(1, cryT / 0.6);
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        var p = (clock * 0.85 + d.userData.offset) % 1;
        d.position.set(
          0.50 * d.userData.side + p * 0.05 * d.userData.side,
          0.02 - p * 1.35,
          0.82 - p * 0.20
        );
        var grow = Math.min(1, p * 5);
        d.scale.set(grow, 1.5 * grow, 0.8 * grow);
        d.material.opacity = 0.9 * fade;
      }
    }




     /* 게임기와 손 동작 */
    updateGaming(
      dt,
      sleeping &&
      mode === 'sleep' &&
      signPhase === 'wait' &&
      signShown <= 0.01 &&
      Math.cos(angle) > 0.96
    );




    /* 자세 */
    var y = -0.05 + (mode === 'sleep' ? 0 : Math.sin(clock * 1.05) * 0.018);
    var rz = 0, rx = 0, px = 0;

    if (hiding) {
      var e = HIDE_TOTAL - hideT;
      var drop;
      if (e < 0.40)      drop = -2.55 * (e / 0.40);                       // 쏙 내려간다
      else if (e < 1.35) drop = -2.55;                                    // 숨어 있는다
      else if (e < 1.75) drop = -2.55 + 1.35 * ((e - 1.35) / 0.40);       // 눈만 빼꼼
      else if (e < 2.65) drop = -1.20 + Math.sin(clock * 3.2) * 0.03;
      else               drop = -1.20 * (1 - Math.min(1, (e - 2.65) / 0.75));
      y += drop;
      rz = 0;
      rx = 0;
    } else if (hitT > 0) {
      var kk = hitT / HIT_TIME;
      rz = Math.sin(hitT * 48) * 0.30 * kk;
      px = Math.sin(hitT * 42) * 0.17 * kk;
      y += Math.sin(hitT * 36) * 0.07 * kk;
    } else if (mode === 'cry') {
      rz = Math.sin(clock * 7.5) * 0.05;
      y += -0.05 + Math.abs(Math.sin(clock * 5.2)) * 0.05;
    } else if (mode === 'angry') {
      rz = Math.sin(clock * 26) * 0.014;
      y += Math.sin(clock * 24) * 0.008;
    } else if (mode === 'sleep') {
      var lean = Math.sin(clock * 1.8);

      // 게임기를 내려다보며 좌우로 살짝 기운다.
      rz = lean * 0.035;
      rx = 0.13 + Math.sin(clock * 2.2) * 0.018;
      px = lean * 0.025;
      y += -0.045 + gameKick * 0.035;
    } else if (mode === 'dizzy') {
      rz = Math.sin(now / 90) * 0.075;
      y += Math.sin(now / 62) * 0.035;
    }

    if (wakeT > 0) y += Math.sin(wakeT * 30) * 0.11 * (wakeT / 0.5);

    /* 팻말 */
    var signBusy = hiding || cryT > 0 || angryT > 0 || dragging;
    signT += dt;
    if (signPhase === 'wait') {
      if (!signBusy && signT >= (clock < SIGN_WAIT + 3 ? SIGN_WAIT : SIGN_GAP)) {
        if (sleeping) { sleeping = false; wakeT = 0.5; }
        signPhase = 'rise'; signT = 0;
      }
    } else if (signPhase === 'rise') {
      if (signBusy) { signPhase = 'fall'; signT = 0; }
      else if (signT >= SIGN_RISE) { signPhase = 'hold'; signT = 0; }
    } else if (signPhase === 'hold') {
      if (signBusy || signT >= SIGN_HOLD) { signPhase = 'fall'; signT = 0; }
    } else if (signPhase === 'fall') {
      if (signT >= SIGN_FALL) { signPhase = 'wait'; signT = 0; }
    }

    var sT = signPhase === 'rise' ? Math.min(1, signT / SIGN_RISE)
           : signPhase === 'hold' ? 1
           : signPhase === 'fall' ? Math.max(0, 1 - signT / SIGN_FALL) : 0;
    signShown += (sT * sT * (3 - 2 * sT) - signShown) * Math.min(1, dt * 16);
    signGroup.position.y = SIGN_DOWN + (SIGN_UP_Y - SIGN_DOWN) * signShown;
    signGroup.visible = signShown > 0.01;
    signGroup.rotation.z = Math.sin(clock * 1.6) * 0.025 * signShown;

    head.rotation.y = angle;
    head.rotation.z += (rz - head.rotation.z) * Math.min(1, dt * 14);
    head.rotation.x += (rx - head.rotation.x) * Math.min(1, dt * 10);
    head.position.x += (px - head.position.x) * Math.min(1, dt * 16);
    head.position.y += (y - head.position.y) * Math.min(1, dt * 14);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
